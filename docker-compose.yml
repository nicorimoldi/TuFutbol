# Servicios de TuFutbol. Los valores ${...} se leen del archivo .env.
name: tufutbol

services:
  db:
    build: ./db   # postgres:alpine con db/schema/schema.sql incluido (ver db/Dockerfile)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:   # la base está lista cuando acepta conexiones
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      retries: 60

  api:
    build: .
    environment:
      # Dentro de Docker la base se encuentra por el nombre del servicio: db
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy   # no arranca hasta que la base esté lista
    healthcheck:   # la API está lista cuando responde GET /partidos
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/partidos"]
      interval: 1s
      retries: 30

volumes:
  db-data:
